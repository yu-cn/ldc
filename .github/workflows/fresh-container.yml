name: fresh-container
# 新机冒烟（Linux 侧对 WDC fresh-machine VM 冒烟的廉价替代）：
# ubuntu:24.04 裸容器内以 root 全量跑 bootstrap + verify，证明「clone 后一条命令开箱即用」。
# 容器内 EUID=0 → root 阶段直接内联（ADR-0004 容器路径，无 sudo 交接）。
# 双架构矩阵（ADR-0006）：amd64 腿在 x64 runner，arm64 腿在 GitHub 免费 arm64 runner
# （ubuntu-24.04-arm 仅对公开仓库免费——本仓库 MIT 开源，与 WDC 同形态）。
# LDC_SKIP_DOCKER=1：容器无 systemd，docker 装了也起不来；LDC_SMOKE=1：冒烟降级——bootstrap
# 待办不计（容器无桌面、身份占位，可退 0），verify 身份断言降为存在性检查（ADR-0004）。
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'   # 每周一 03:00 UTC

jobs:
  handoff:
    # ADR-0004 交接路径实证（下方 smoke 矩阵只覆盖 root 内联路径）：非 root 用户 + 装了 sudo
    # 但未免密 → sudo_probe=interactive → bootstrap 应 exit 2 并打印单条交接命令，其余阶段照常
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: ubuntu:24.04
    steps:
      - name: 前置 + fresh clone（非 root 用户）
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl ca-certificates sudo >/dev/null
          useradd -m -s /bin/bash dev
          git clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" /home/dev/ldc
          chown -R dev:dev /home/dev/ldc
      - name: bootstrap（应走交接路径：exit 2 + 交接命令）
        run: |
          set +e
          su dev -c 'cd ~/ldc && LDC_SMOKE=1 bash bootstrap.sh' > /tmp/boot.log 2>&1
          rc=$?
          cat /tmp/boot.log
          [ "$rc" -eq 2 ] || { echo "::error::期望 exit 2（交接待办），实际 $rc"; exit 1; }
          grep -q 'root 阶段交接' /tmp/boot.log || { echo "::error::未见交接命令块"; exit 1; }
          grep -q 'sudo bash scripts/install-packages.sh' /tmp/boot.log || { echo "::error::交接命令内容不符"; exit 1; }
      - name: 上传交接路径日志
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: handoff-bootstrap-log
          path: /tmp/boot.log

  smoke:
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false    # 一腿失败也跑完另一腿，判读以日志为准
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    name: smoke (${{ matrix.arch }})
    timeout-minutes: 30
    container: ubuntu:24.04
    steps:
      # 容器无 git/curl：先装前置（等价 README 的「前置：装好 git 与 curl」），再 fresh clone
      - name: 前置 + fresh clone
        run: |
          apt-get update -qq
          apt-get install -y -qq git curl ca-certificates >/dev/null
          git clone "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" /tmp/ldc
      - name: bootstrap（root 全量）
        env:
          LDC_SKIP_DOCKER: '1'
          LDC_SMOKE: '1'
        run: bash /tmp/ldc/bootstrap.sh
      - name: verify（--quick）
        env:
          LDC_SKIP_DOCKER: '1'
          LDC_SMOKE: '1'
        run: bash /tmp/ldc/scripts/verify-machine.sh --quick
      # 幂等证明（工单 upstream-borrow/04；上游 CI 同语义：装完重跑一遍，零变更才算收敛干净）
      - name: 重跑 bootstrap（幂等证明：第二遍应零变更）
        env:
          LDC_SKIP_DOCKER: '1'
          LDC_SMOKE: '1'
        run: |
          set +e
          bash /tmp/ldc/bootstrap.sh > /tmp/rerun.log 2>&1
          rc=$?
          cat /tmp/rerun.log
          [ "$rc" -eq 0 ] || { echo "::error::第二遍 bootstrap 退出码 $rc（期望 0）"; exit 1; }
          if grep -q '\[CHANGED\]' /tmp/rerun.log; then
            echo "::error::第二遍仍有 CHANGED——幂等被破坏"
            exit 1
          fi
          echo "幂等确认：第二遍 exit 0 且零 CHANGED"
      # 成败都带日志回来，判读以日志为准
      - name: 上传 bootstrap 日志（成败都传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bootstrap-logs-${{ matrix.arch }}
          path: |
            /tmp/ldc/logs/
            /tmp/rerun.log
