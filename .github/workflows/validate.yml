name: validate
# 源头防线：任何 push/PR 上跑无副作用校验——pre-commit 钩子被绕过（钩子未接线/本机无 shellcheck）时兜底，
# 防止坏 commit 进 main（所有机器 pull 即受影响）。只读校验，不改任何状态。
on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest   # runner 自带 shellcheck，硬把关
    steps:
      - uses: actions/checkout@v5
      - name: 无副作用校验（bash -n + shellcheck + 清单格式）
        run: ./validate.sh
